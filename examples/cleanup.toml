# ava example mag: cleanup — script-style config
# conservative maintenance: journal, package cache, stale /tmp files.
# install: ava mag get cleanup

[[cmd]]
name = "cleanup"
desc = "Free space: journal (7d), apt cache, old /tmp files"
kind = "shell"
run = '''
set -eu
echo "== journal (keep 7 days) =="
sudo journalctl --vacuum-time=7d 2>/dev/null || echo "(no systemd journal)"
echo "== package cache =="
sudo apt-get clean 2>/dev/null || true
echo "== /tmp files untouched for 7 days =="
find /tmp -type f -atime +7 -delete 2>/dev/null || true
echo "done."
'''

[[cmd]]
name = "bigdirs"
desc = "Top 10 space hogs under /var"
kind = "shell"
run = "sudo du -xh /var 2>/dev/null | sort -rh | head -10"
